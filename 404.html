<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Z-A-S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH">

</head>
<body>
  <button class="loading" id="loading">
    <div class="spinner-grow" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </button>

  <header></header>

  <main class="container my-5 text-center py-5">
    <div class="p-5 my-4 jumbotron rounded-3 border shadow-sm">
      <h1 class="display-1 fw-bold error-code">404</h1>
      <h2 class="display-6 mb-3">Page Not Found</h2>
      <p class="lead mb-4">Couldn't find this page. Maybe someone stole it or the URL is incorrect.</p>
      <a class="btn button btn-lg px-4" href="index.html">Back to Home</a>
    </div>
  </main>

  <footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="scripts/darkmode.js"></script>
  <script src="scripts/layout.js"></script>
  <script src="scripts/script.js"></script>

</html>
