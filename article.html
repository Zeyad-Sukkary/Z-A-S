<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Article | Z-A-S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH">
    <link rel="stylesheet" href="style.css">
    <style>
      .news-item img {
        max-width: 100% !important;
        height: auto;
        margin-bottom: 15px;
        border-radius: 8px;
      }
      .sidebar {
        position: sticky;
        top: 2rem;
      }
    </style>
</head>
<body>
  <button class="loading" id="loading">
    <div class="spinner-grow" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </button>

  <header></header>

  <main class="container my-4">
    <section class="d-flex mt-4 justify-content-center mb-4 row" id="main-section">
      <!-- Article Content Column -->
      <article class="col-12 news-item col-md-8 p-4 rounded-3 border shadow-sm">
        <h1 id="article-title" class="display-5 fw-bold mb-3">
          <!-- Title will be injected here -->
        </h1>

        <div class="d-flex w-100 justify-content-between align-items-center p-2 mb-3 border-bottom border-top">
          <h5 id="author" class="mb-0">
            <!-- Author will be injected here -->
          </h5>
          <h5 id="article-date" class="mb-0">
            <!-- Date will be injected here -->
          </h5>
        </div>

        <img id="image" src="pics/default-image.webp" class="img-fluid rounded mb-4" alt="Article Cover Image">

        <div id="article-content" class="lh-lg">
          <!-- Article content will be injected here -->
        </div>
      </article>

      <!-- Sidebar Column -->
      <div class="sidebar col-12 col-md-4 mt-4 mt-md-0">
        <div class="sidebar-container p-4 mb-3 rounded-3 border shadow-sm">
          <h4 class="fst-italic border-bottom pb-2">Related Posts</h4>
          <ul class="recent-posts row list-unstyled mb-0">
            <!-- Related articles will be injected here -->
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@16.0.0/lib/marked.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="scripts/darkmode.js"></script>
  <script src="scripts/layout.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/articlescript.js"></script>
</body>
</html>
