<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Z-A-S</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <button class="loading" id="loading">
      <div class="spinner-grow" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </button>

    <header></header>

    <main>
      <!-- Featured Carousel Section -->
      <section class="my-5">
        <div id="featuredContainer">
          <!-- JS will inject carousel here -->
        </div>
      </section>

      <div class="slide-in-left nonedisplay maintext alert fade-in parent">
        <span class="closebtn fade-in child" onclick="this.parentElement.style.display='none';">&times;</span>
        This website's Mode has not been updated in a while.
      </div>

      <button class="btn btn-accent continue-toggle" type="button" data-bs-toggle="offcanvas" data-bs-target="#continueReadingPanel" aria-controls="continueReadingPanel">
        Continue Reading
      </button>

      <aside class="offcanvas offcanvas-start continue-reading-panel" tabindex="-1" id="continueReadingPanel" aria-labelledby="continueReadingTitle">
        <div class="offcanvas-header">
          <h2 class="offcanvas-title h4" id="continueReadingTitle">Continue Reading</h2>
          <button type="button" class="btn-close themed-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <div id="continue-reading-list" class="continue-reading-list stagger-children">
            <p class="mb-0">Loading articles...</p>
          </div>
        </div>
      </aside>

      <div class="container px-4 py-3 top-headlines-section" id="trending-cards">
        <h2 class="pb-2 border-bottom">
          <b><span class="topheadlines1">Top</span> <span class="topheadlines2">Headlines</span></b>
        </h2>
        <div class="row justify-content-center align-items-stretch g-4 py-5" id="trendingContainer">
          <!-- Cards will be injected here by JS -->
        </div>
      </div>

      <section class="featured-news container">
        <h2 class="fade-in d-flex"><b>Featured News</b></h2>

        <div class="slide-in-left maintext d-none alert">
          <span class="fade-in closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
          Info on this website may not be factually accurate. Proceed with <strong style="color: red">Caution</strong>.
        </div>

        <div class="news-container row" id="article-preview-container">
          <!-- JS will inject preview items here -->
          <p id="noArticlesMsg" class="d-none">No articles found.</p>
        </div>
      </section>

      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center my-4">
        <a href="Discover.html" class="btn btn-outline-themed btn-lg" role="button">Discover More Articles</a>
      </div>
    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@16.0.0/lib/marked.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="scripts/darkmode.js"></script>
    <script src="scripts/layout.js"></script>
    <script src="scripts/script.js"></script>
    <script src="scripts/homearticlepreview.js"></script>
  </body>
</html>
