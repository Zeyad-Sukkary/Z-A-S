<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover | Z-A-S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="loading" id="loading">
    <div class="spinner-grow" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </button>

  <header></header>

  <nav class="py-2 border-bottom container my-2" aria-label="Article categories">
    <div class="nav nav-pills justify-content-center">
      <ul id="categoryNav" class="nav nav-underline justify-content-center">
        <!-- Categories inserted here dynamically -->
      </ul>
    </div>
  </nav>

  <main class="container my-4">
    <section class="Latest-news">
      <!-- Controls Toolbar -->
      <div class="discover-toolbar d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 p-3">
        <h1 class="fade-in mb-0 h3">Latest News</h1>

        <div class="d-flex flex-wrap gap-2 align-items-center">
          <!-- Filter by Author -->
          <select id="authorFilter" class="form-select w-auto">
            <option value="none" selected>Filter by Author (All)</option>
          </select>

          <!-- Sort Options -->
          <select id="sortOptions" class="form-select w-auto">
            <option value="date" selected>Sort by Date</option>
            <option value="trending">Filter by Trending</option>
            <option value="title">Sort by Title</option>
            <option value="author">Sort by Author</option>
            <option value="category">Sort by Category</option>
          </select>
        </div>
      </div>

      <!-- Articles container -->
      <div class="news-container">
        <div id="article-preview-container">
          <!-- JS will inject articles here -->
        </div>

        <div id="noArticlesMsg" class="text-center my-5 p-4 rounded-3 border nonedisplay">
          <p class="h5 mb-0">No articles found based on the current parameters.</p>
        </div>
      </div>
    </section>
  </main>

  <footer></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@16.0.0/lib/marked.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="scripts/darkmode.js"></script>
  <script src="scripts/layout.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/Discoversystem.js"></script>
</body>
</html>
